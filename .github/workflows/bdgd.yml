name: BDGD Cosern

# Todo dia 5, às 06:17 (UTC): procura BDGD nova da Cosern na ANEEL; se houver, gera o pacote e publica uma release.
# O cadastro da Guarani Solar baixa releases/latest/download/meta.json e pacote.zip.
on:
  schedule:
    - cron: '17 6 5 * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Reprocessar mesmo sem BDGD nova'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # para reativar o próprio agendamento (ver o último passo)

concurrency:
  group: bdgd
  cancel-in-progress: false

jobs:
  bdgd:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: GDAL
        run: sudo apt-get update -q && sudo apt-get install -y -q gdal-bin

      - name: Processar
        id: proc
        run: python3 processa.py ${{ inputs.forcar && '--forcar' || '' }}

      - name: Publicar release
        if: steps.proc.outputs.novo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCIA: ${{ steps.proc.outputs.referencia }}
          TITULO: ${{ steps.proc.outputs.titulo }}
        run: |
          set -e
          TAG="rede-${REFERENCIA}-$(date -u +%Y%m%d%H%M)"
          # primeiro a release; o estado só é gravado depois que ela existe
          gh release create "$TAG" saida/pacote.zip saida/meta.json --latest \
            --title "Rede Cosern – BDGD ref. ${REFERENCIA}" \
            --notes "Recorte de ${TITULO} (ANEEL, licença ODbL) para o cadastro da Guarani Solar."
          git config user.name "bdgd-bot"
          git config user.email "bdgd-bot@users.noreply.github.com"
          git add estado.json
          git commit -m "BDGD ${TITULO}" || true
          git push

      # O GitHub desliga agendamentos de repositório público após 60 dias sem atividade; a BDGD sai uma vez por ano.
      # Reativar o workflow a cada execução mantém a rotina mensal viva.
      - name: Manter o agendamento ativo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bdgd.yml/enable" || true
